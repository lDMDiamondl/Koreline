name: CelesteKRPatch 릴리즈 알림

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 릴리즈 확인 및 Discord 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPO: lDMDiamondl/CelesteKRPatch
          LAST_RELEASE_FILE: last_release.txt
        run: python check_release.py

      - name: last_release.txt 커밋 (변경된 경우만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_release.txt
          git diff --cached --quiet || git commit -m "chore: update last release id [skip ci]"
          git push
